name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check dist/heizungsanlage-card.js
      - name: Versionen prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "const CARD_VERSION = '${TAG}';" dist/heizungsanlage-card.js || { echo "CARD_VERSION passt nicht zu ${GITHUB_REF_NAME}"; exit 1; }
          grep -q "\"version\": \"${TAG}\"" package.json || { echo "package.json passt nicht zu ${GITHUB_REF_NAME}"; exit 1; }
      - name: Release-Notes aus CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="## ${TAG}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/heizungsanlage-card.js
